<div class="w-full flex min-h-full flex-col justify-center px-6 py-12 lg:px-8 mb-5">

        <div class=" w-full flex justify-center pt-3">
            <label for="Toggle3" class="inline-flex items-center p-2 rounded-md cursor-pointer dark:text-gray-100">
                <input id="Toggle3" type="checkbox" class="hidden peer" (click)="cambiarForm()">
                <span class="px-4 py-2 rounded-l-md bg-green-300 peer-checked:bg-gray-200">Inicio Sesión</span>
                <span class="px-4 py-2 rounded-r-md bg-gray-200 peer-checked:bg-green-300">Registro</span>
            </label>
        </div>    
  

        @if (isLogin){
            <div class="sm:mx-auto sm:w-full sm:max-w-sm w-full">
                <img class="mx-auto h-16 w-auto rounded-full" src="./../../../../assets/imagenes/logo/Logo2.jpeg" alt="Your Company">
                <h2 class="mt-6 text-center text-2xl font-bold leading-9 tracking-tight text-gray-900">inicio de Sesión</h2>
          
              </div>

            <form class="space-y-6 w-full" #frmLogin="ngForm" (ngSubmit)="onLogin(frmLogin)">
                    <div class="flex flex-wrap -mx-3 mb-6">
                        <div class="w-full px-3">
                          <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="email">
                            Correo Electrónico
                          </label>
                          <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none 
                          focus:bg-white focus:border-gray-500" id="email" type="email" name="email" placeholder="federico@gmail.com " ngModel required>
                          <p class="text-gray-600 text-xs italic invisible">Make it as long and as crazy as you'd like</p>
                        </div>
                      </div>

                    <div class="flex flex-wrap -mx-3 mb-6">
                      <div class="w-full px-3">
                        <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="password">
                          Password
                        </label>
                        <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none 
                        focus:bg-white focus:border-gray-500" id="password" type="password" name="password" placeholder="******************" ngModel required>
                        <p class="text-gray-600 text-xs italic invisible">añdir el texto de error</p>
                      </div>
                    </div>
                    <div>
                        <button type="submit" class="flex w-full justify-center rounded-md bg-green-400 px-3 py-1.5 text-sm font-semibold leading-6 text-white 
                        shadow-sm hover:bg-xDarkSlateGray focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600" 
                        id="inicioSesion">Iniciar Sesión</button>
                    </div> 
            </form>

        }@else{
            <div class="sm:mx-auto sm:w-full sm:max-w-sm">
                <img class="mx-auto h-16 w-auto rounded-full" src="./../../../../assets/imagenes/logo/Logo2.jpeg" alt="Your Company">
                <h2 class="mt-6 text-center text-2xl font-bold leading-9 tracking-tight text-gray-900">Registro de Usuario</h2>
          
              </div>

            <form class="space-y-6" #frmRegistro="ngForm" (ngSubmit)="registro(frmRegistro)">
                    <div class="flex flex-wrap -mx-3 mb-6">
                      <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">
                        <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="nombre">
                          Nombre
                        </label>
                        <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white" 
                        id="nombre" type="text" placeholder="Federicol" name="nombre" ngModel  >
                        <!-- lo haremos visible con el form reactive si contiene caracteres que no son texto -->
                        <p class="text-red-500 text-xs italic invisible">introduce valores correctos</p>
                      </div>
                      <div class="w-full md:w-1/2 px-3">
                        <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="apellidos">
                          Apellidos
                        </label>
                        <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500" 
                        id="apellidos" type="text" placeholder="Sanchez García" name="apellidos" ngModel >
                      </div>
                    </div>

                    <div class="flex flex-wrap -mx-3 mb-6">
                        <div class="w-full px-3">
                          <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="registroEmail">
                            Correo Electrónico
                          </label>
                          <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white 
                          focus:border-gray-500" id="registroEmail" name="registroEmail" type="email" placeholder="federico@gmail.com" ngModel >
                          <p class="text-gray-600 text-xs italic">Make it as long and as crazy as you'd like</p>
                        </div>
                      </div>

                    <div class="flex flex-wrap -mx-3 mb-6">
                      <div class="w-full px-3">
                        <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="registroPassword">
                          Contraseña
                        </label>
                        <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white 
                        focus:border-gray-500" id="registroPassword" name="registroPassword" type="password" placeholder="******************" ngModel >
                        <p class="text-gray-600 text-xs italic">añadir el texto de error</p>
                      </div>
                    </div>
                    <div class="flex flex-wrap -mx-3 mb-2">
                      <div class="w-full md:w-1/3 px-3 mb-6 md:mb-0">
                        <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="ciudad">
                          Ciudad
                        </label>
                        <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500" 
                        id="ciudad" name="ciudad" type="text" placeholder="Albuquerque" ngModel >
                      </div>
                      <div class="w-full md:w-1/3 px-3 mb-6 md:mb-0">
                        <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="cp">
                          CP
                        </label>
                        <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500" 
                        id="cp" name="cp" type="text" placeholder="90210" ngModel >
                      </div>
                    </div>
                    <div>
                        <button type="submit" class="flex w-full justify-center rounded-md bg-green-400 px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm
                         hover:bg-xDarkSlateGray focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600" id="registro">Registro</button>
                    </div> 
            </form>

        }
  
  </div>
