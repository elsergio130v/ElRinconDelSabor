<!-- Estructura básica del formulario de reserva -->
<div class="bg-white text-black">
   <div class="max-w-2xl mx-auto py-16 px-4 sm:py-24 sm:px-6 lg:px-8">
     <div class="text-center">
       <h2 class="text-base font-semibold text-red-600 tracking-wide uppercase">Reserva de Mesa</h2>
       <p class="mt-1 text-4xl font-extrabold text-gray-900 sm:text-5xl sm:tracking-tight lg:text-6xl">Comida & Cena</p>
       <p class="max-w-xl mt-5 mx-auto text-xl text-gray-500">13/04/2020 - 13:00</p>
     </div>
 
     <!-- Formulario -->
     <form action="#" method="POST" class="mt-12">
       <!-- Número de comensales -->
       <div class="grid grid-cols-1 gap-y-6 sm:grid-cols-3 sm:gap-x-8">
         <div class="sm:col-span-2">
           <label for="comensales" class="block text-sm font-medium text-gray-700">Nº Comensales</label>
           <div class="mt-1">
             <!-- Botones para seleccionar el número de comensales -->
             <span class="inline-flex rounded-md shadow-sm">
               <button type="button" class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                 2
               </button>
               <!-- ... otros botones ... -->
               <button type="button" class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                 8
               </button>
             </span>
           </div>
         </div>
       </div>
 
       <!-- Preferencias de mesa -->
       <div class="mt-6">
         <label for="mesa" class="block text-sm font-medium text-gray-700">Preferencia de Mesa</label>
         <div class="mt-1">
           <!-- Botones para seleccionar la mesa preferida -->
           <span class="inline-flex rounded-md shadow-sm">
             <button type="button" class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
               Mesa #3
             </button>
             <!-- ... otros botones ... -->
           </span>
         </div>
       </div>
 
       <!-- ... resto del formulario ... -->
 
       <!-- Botón de envío -->
       <div class="mt-6">
         <span class="block w-full rounded-md shadow-sm">
           <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent text-base font-medium rounded-md text-white bg-orange-600 hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500">
             Reservar
           </button>
         </span>
       </div>
     </form>
   </div>
 </div>
