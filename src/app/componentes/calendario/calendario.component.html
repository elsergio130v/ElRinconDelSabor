<!-- Datepicker -->
<script>
    function changeMonth(step) {
      // Obtener el select del mes
      var selectMonth = document.getElementById('select-month');
      // Obtener el índice actual seleccionado
      var currentIndex = selectMonth.selectedIndex;
      // Calcular el nuevo índice
      var newIndex = currentIndex + step;
      // Asegurarse de que el nuevo índice esté dentro de los límites
      newIndex = Math.min(Math.max(newIndex, 0), selectMonth.options.length - 1);
      // Actualizar el select con el nuevo índice
      selectMonth.selectedIndex = newIndex;
    }
  </script>
