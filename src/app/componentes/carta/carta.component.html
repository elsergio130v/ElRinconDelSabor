<main id="content">
  <div class="max-w-[85rem] mx-auto py-10 px-4 sm:px-6 lg:px- grid grid-cols-2 gap-4">
@for (pizza of listadoPizzas(); track $index) {

    <div class="flex flex-col bg-white border shadow-sm rounded-xl dark:bg-neutral-900 dark:border-neutral-700 dark:shadow-neutral-700/70">
      <img class="w-full h-auto rounded-t-xl" src="./../../../../assets/imagenes/pizzas/{{pizza.imagen}}" alt="Image Description">
      <div class="p-4 md:p-5">
        <h3 class="text-lg font-bold text-gray-800 dark:text-white">
          {{pizza.nombre}}
        </h3>
        <p class="mt-1 text-gray-500 dark:text-neutral-400">
          {{pizza.descripcion}}
        </p>
        @if (Usuario.dataUser.rol === "EMPLEADO") {
          <a class="mt-2 py-2 px-3 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border 
          border-transparent bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none" 
          href="#">
            Añadir al Pedido.
          </a> 
          }
      </div>
    </div>
}
  </div>
</main>
