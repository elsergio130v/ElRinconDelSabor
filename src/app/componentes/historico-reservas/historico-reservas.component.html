
<div class="p-10">
    <div class="relative overflow-x-auto shadow-md sm:rounded-lg rounded-lg">
        <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400 rounded-2xl">
            <thead class="bg-green-200 text-xs text-gray-700 uppercase  dark:bg-gray-700 dark:text-gray-400">
                <tr >
                    <th scope="col" class="px-6 py-3">
                        Comensales
                    </th>
                    <th scope="col" class="px-6 py-3">
                        Hora de Inicio Reserva
                    </th>
                    <th scope="col" class="px-6 py-3">
                        Hora Final de Reserva
                    </th>
                    <th scope="col" class="px-6 py-3">
                        email del Usuario 
                    </th>
                    <th scope="col" class="px-6 py-3">
                        <span class="sr-only">Eliminar</span>
                    </th>
                    <th>
                    <span class="sr-only ">Editar</span>
                    </th>
                </tr>
            </thead>
            <tbody>
                @for (item of lista; track item) {
                <tr class="odd:bg-white odd:dark:bg-gray-900 odd:hover:bg-gray-200 even:bg-green-100 even:dark:bg-gray-800
                 even:hover:bg-green-200 bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50
                  dark:hover:bg-gray-600">
                    <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
                        {{item.comensales}} 
                    </th>
                    <td class="px-6 py-4">
                        
                        {{item.horaInicio}}
                    </td>
                    <td class="px-6 py-4">
                        
                        {{item.horaFinal}}
                    </td>
                    <td class="px-6 py-4">
                        
                        {{item.email}}
                    </td>
                    <td class="px-6 py-4 text-right">
                        <a
                         class="flex flex-col items-center cursor-pointer font-medium text-blue-600 dark:text-blue-500 
                        hover:underline ">
                            <svg class="w-6 h-6 text-red-600 dark:text-white hover:scale-125 duration-200" 
                            aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 7h14m-9 
                                3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z"/>
                            </svg>
                        </a>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <a  class="font-medium text-blue-600 dark:text-blue-500 hover:underline">
                            <svg class="w-6 h-6 text-gray-800 dark:text-white hover:scale-125 duration-200" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="square" stroke-linejoin="round" stroke-width="2" d="M7 19H5a1 1 0 0 1-1-1v-1a3 3 0 0 1 3-3h1m4-6a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm7.4 1.6a2 2 0 0 1 0 2.7l-6 6-3.4.7.7-3.4 6-6a2 2 0 0 1 2.7 0Z"/>
                            </svg>
                        </a>
                    </td>
                </tr>
            }
            </tbody>
        </table>
    </div>
</div>
