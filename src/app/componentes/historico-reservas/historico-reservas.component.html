
<div class="p-10">
    <div class="relative overflow-x-auto shadow-md sm:rounded-lg rounded-lg">
        <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400 rounded-2xl">
            <thead class="bg-green-200 text-xs text-gray-700 uppercase  dark:bg-gray-700 dark:text-gray-400">
                <tr >
                    <th scope="col" class="px-6 py-3">
                        Comensales
                    </th>
                    <th scope="col" class="px-6 py-3">
                        Hora de Inicio Reserva
                    </th>
                    <th scope="col" class="px-6 py-3">
                        Hora Final de Reserva
                    </th>
                    <th scope="col" class="px-6 py-3">
                        email del Usuario 
                    </th>
                    <th scope="col" class="px-6 py-3">
                        <span class="sr-only">Eliminar</span>
                    </th>
                    <th>
                    <span class="sr-only ">Editar</span>
                    </th>
                </tr>
            </thead>
            <tbody>

                @for (item of lista; track item) {
                <tr class="odd:bg-white odd:dark:bg-gray-900 odd:hover:bg-gray-200 even:bg-green-100 even:dark:bg-gray-800
                 even:hover:bg-green-200 bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50
                  dark:hover:bg-gray-600">
                    <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
                        {{item.comensales}} 
                    </th>
                    <td class="px-6 py-4">
                        
                        {{item.horaInicio | date:'MMM d, y, H:mm'}}
                    </td>
                    <td class="px-6 py-4">
                        
                        {{item.horaFinal | date:'MMM d, y, H:mm'}}
                    </td>
                    <td class="px-6 py-4">
                        
                        {{item.emailUsuario}}
                    </td>
                </tr>
            }
            </tbody>
        </table>
    </div>
</div>
